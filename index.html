<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thecarrot.rest</title>
<style>
  :root {
    --bg: #F2F6EC;
    --ink: #1C2417;
    --accent: #4C7A3D;
    --line: #D8E4CB;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1.25rem 2.5rem;
    overscroll-behavior: none;
  }
  .brand { font-size: 0.95rem; color: #6E8A5E; margin-bottom: 1.2rem; }
  .loading { text-align: center; padding: 2rem; color: #6E8A5E; font-family: var(--mono); font-size: 0.85rem; }

  /* --- La pista: vertical en desktop, horizontal en móvil --- */
  #track {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 1.25rem;
    width: 100%;
    max-width: 420px;
    min-height: 520px;
    touch-action: none;
  }
  @media (max-width: 640px) {
    #track {
      flex-direction: row;
      min-height: 0;
      min-width: 100%;
      height: 170px;
      overflow-x: auto;
    }
  }

  .zone { display: flex; align-items: center; justify-content: center; font-size: 3rem; flex-shrink: 0; }
  #zone-start, #zone-end { width: 4.5rem; height: 4.5rem; }

  .barrier {
    display: flex;
    flex-direction: row;
    gap: 0.35rem;
    font-size: 1.6rem;
    transition: gap .5s ease;
  }
  @media (max-width: 640px) {
    .barrier { flex-direction: column; }
  }
  .barrier .half { display: flex; flex-direction: row; gap: 0.35rem; transition: transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s ease; }
  @media (max-width: 640px) {
    .barrier .half { flex-direction: column; }
  }
  .barrier.open .half.a { transform: translate(-28px, -14px) rotate(-12deg); opacity: 0.25; }
  .barrier.open .half.b { transform: translate(28px, 14px) rotate(12deg); opacity: 0.25; }
  @media (max-width: 640px) {
    .barrier.open .half.a { transform: translate(-14px, -28px) rotate(-12deg); opacity: 0.25; }
    .barrier.open .half.b { transform: translate(14px, 28px) rotate(12deg); opacity: 0.25; }
  }

  #bunny {
    position: absolute;
    font-size: 3.2rem;
    cursor: grab;
    user-select: none;
    touch-action: none;
    z-index: 5;
    transition: left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
  }
  #bunny.dragging { cursor: grabbing; transition: none; }

  .status-text { font-size: 0.95rem; text-align: center; max-width: 30ch; min-height: 2.6em; margin-top: 0.4rem; font-weight: 600; }
  .hint { font-family: var(--mono); font-size: 0.72rem; color: #8BA27C; margin-top: -0.6rem; }

  .links { display: flex; gap: 1rem; margin-top: 1.4rem; font-family: var(--mono); font-size: 0.78rem; }
  .links a, .links button { color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; font-size: inherit; padding: 0; }
  #policy-box, #tech-box { display: none; width: 100%; max-width: 420px; margin-top: 1rem; }
  #policy-box pre, #tech-box pre { font-size: 0.72rem; background: #E9F0E1; border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div class="brand">thecarrot.rest</div>

  <div id="loading" class="loading">Checking Bunny's credential…</div>

  <div id="track" style="display:none">
    <div class="zone" id="zone-start">
      <span id="bunny">🐇</span>
    </div>

    <div class="barrier" id="barrier-chain">
      <div class="half a"><span>🔗</span><span>🔗</span><span>🔗</span></div>
      <div class="half b"><span>🔗</span><span>🔗</span><span>🔗</span></div>
    </div>

    <div class="zone" id="zone-mid" style="font-size:1rem; min-height:1px; min-width:1px;"></div>

    <div class="barrier" id="barrier-wall">
      <div class="half a"><span>🧱</span><span>🧱</span><span>🧱</span></div>
      <div class="half b"><span>🧱</span><span>🧱</span><span>🧱</span></div>
    </div>

    <div class="zone" id="zone-end">🥕</div>
  </div>

  <p class="status-text" id="status-text" style="display:none"></p>
  <p class="hint" id="hint" style="display:none">drag 🐇 forward</p>

  <div class="links">
    <button id="policy-toggle">view policy</button>
    <button id="tech-toggle">technical panel</button>
  </div>

  <div id="policy-box">
    <pre>_aria-policy.thecarrot.rest TXT
"v=ATP1; min=L0; req.reach=carrot:action:reach; req.eat=carrot:action:eat; fresh=3600; anchor=wellknown"</pre>
  </div>

  <div id="tech-box">
    <pre id="tech-content">—</pre>
  </div>

  <script type="module">
    import { verifyAgent, setRegistryKeys } from 'https://esm.sh/@aria-registry/verify@1.1.0';

    const BUNNY_ORIGIN = 'https://thebunny.bar';

    document.getElementById('policy-toggle').addEventListener('click', () => {
      const box = document.getElementById('policy-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });
    document.getElementById('tech-toggle').addEventListener('click', () => {
      const box = document.getElementById('tech-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });

    function hexToBytes(hex) {
      const clean = hex.trim();
      const bytes = new Uint8Array(clean.length / 2);
      for (let i = 0; i < clean.length; i += 2) bytes[i / 2] = parseInt(clean.substring(i, i + 2), 16);
      return bytes;
    }

    function base64urlToJson(param) {
      let base64 = param.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4 !== 0) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function setStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    // --- Lógica de arrastre + barreras ---
    const track = document.getElementById('track');
    const bunny = document.getElementById('bunny');
    const chainBarrier = document.getElementById('barrier-chain');
    const wallBarrier = document.getElementById('barrier-wall');
    const zoneStart = document.getElementById('zone-start');
    const zoneEnd = document.getElementById('zone-end');

    let chainOpen = false;
    let wallOpen = false;
    const axisIsVertical = () => window.matchMedia('(min-width: 641px)').matches;

    function clampLimit() {
      const trackRect = track.getBoundingClientRect();
      if (!chainOpen) {
        const r = chainBarrier.getBoundingClientRect();
        return axisIsVertical() ? r.top - trackRect.top : r.left - trackRect.left;
      }
      if (!wallOpen) {
        const r = wallBarrier.getBoundingClientRect();
        return axisIsVertical() ? r.top - trackRect.top : r.left - trackRect.left;
      }
      const r = zoneEnd.getBoundingClientRect();
      return axisIsVertical()
        ? (r.top - trackRect.top + r.height / 2)
        : (r.left - trackRect.left + r.width / 2);
    }

    function placeBunnyAt(pos) {
      const trackRect = track.getBoundingClientRect();
      const sr = zoneStart.getBoundingClientRect();
      if (axisIsVertical()) {
        bunny.style.left = (sr.left - trackRect.left + sr.width / 2 - bunny.offsetWidth / 2) + 'px';
        bunny.style.top = (pos - bunny.offsetHeight / 2) + 'px';
      } else {
        bunny.style.top = (sr.top - trackRect.top + sr.height / 2 - bunny.offsetHeight / 2) + 'px';
        bunny.style.left = (pos - bunny.offsetWidth / 2) + 'px';
      }
    }

    function initialBunnyPos() {
      const trackRect = track.getBoundingClientRect();
      const r = zoneStart.getBoundingClientRect();
      return axisIsVertical()
        ? (r.top - trackRect.top + r.height / 2)
        : (r.left - trackRect.left + r.width / 2);
    }

    let currentPos = 0;
    let dragging = false;
    let dragStartClient = 0;
    let dragStartPos = 0;

    function pointerAxisValue(e) {
      return axisIsVertical() ? e.clientY : e.clientX;
    }

    bunny.addEventListener('pointerdown', (e) => {
      dragging = true;
      bunny.classList.add('dragging');
      bunny.setPointerCapture(e.pointerId);
      dragStartClient = pointerAxisValue(e);
      dragStartPos = currentPos;
    });
    bunny.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const delta = pointerAxisValue(e) - dragStartClient;
      const min = 0;
      const max = clampLimit();
      let next = dragStartPos + delta;
      next = Math.max(min, Math.min(max, next));
      currentPos = next;
      placeBunnyAt(currentPos);
    });
    function midpointPos() {
      const trackRect = track.getBoundingClientRect();
      const a = axisIsVertical()
        ? chainBarrier.getBoundingClientRect().bottom
        : chainBarrier.getBoundingClientRect().right;
      const b = axisIsVertical()
        ? wallBarrier.getBoundingClientRect().top
        : wallBarrier.getBoundingClientRect().left;
      const base = axisIsVertical() ? trackRect.top : trackRect.left;
      return ((a - base) + (b - base)) / 2;
    }
    function endPos() {
      const trackRect = track.getBoundingClientRect();
      const r = zoneEnd.getBoundingClientRect();
      return axisIsVertical()
        ? (r.top - trackRect.top + r.height / 2)
        : (r.left - trackRect.left + r.width / 2);
    }
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      bunny.classList.remove('dragging');
      const candidates = [initialBunnyPos()];
      if (chainOpen) candidates.push(midpointPos());
      if (wallOpen) candidates.push(endPos());
      let best = candidates[0];
      let bestDist = Math.abs(currentPos - best);
      for (const c of candidates) {
        const d = Math.abs(currentPos - c);
        if (d < bestDist) { best = c; bestDist = d; }
      }
      currentPos = best;
      placeBunnyAt(currentPos);
    }
    bunny.addEventListener('pointerup', endDrag);
    bunny.addEventListener('pointercancel', endDrag);

    window.addEventListener('resize', () => {
      currentPos = initialBunnyPos();
      placeBunnyAt(currentPos);
    });

    function render({ chainDown, wallDown, tech }) {
      chainOpen = chainDown;
      wallOpen = wallDown;
      if (chainDown) chainBarrier.classList.add('open');
      if (wallDown) wallBarrier.classList.add('open');
      document.getElementById('tech-content').textContent = tech;
      document.getElementById('hint').style.display = 'block';
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const credParam = params.get('credential');

      document.getElementById('loading').style.display = 'none';
      track.style.display = 'flex';
      document.getElementById('status-text').style.display = 'block';

      requestAnimationFrame(() => {
        currentPos = initialBunnyPos();
        placeBunnyAt(currentPos);
      });

      if (!credParam) {
        setStatus('🔗 Who goes there? Bunny can\'t prove it yet.');
        render({ chainDown: false, wallDown: false, tech: 'No credential presented.' });
        return;
      }

      let credential;
      try {
        credential = base64urlToJson(credParam);
      } catch (e) {
        setStatus('🔗 That link is malformed — Bunny stays put.');
        render({ chainDown: false, wallDown: false, tech: 'Could not decode credential param: ' + e.message });
        return;
      }

      let identity;
      try {
        const res = await fetch(BUNNY_ORIGIN + '/.well-known/aria-identity.json', { cache: 'no-store' });
        identity = await res.json();
      } catch (e) {
        setStatus('🔗 Could not reach thebunny.bar to check the key.');
        render({ chainDown: false, wallDown: false, tech: 'Discovery fetch failed: ' + e.message });
        return;
      }

      setRegistryKeys(hexToBytes(identity.pq), hexToBytes(identity.ed));
      const result = verifyAgent(credential);

      if (!result.valid) {
        setStatus('🔗 Signature check failed — the chain stays shut.');
        render({ chainDown: false, wallDown: false, tech: 'Rejected — ' + result.reason });
        return;
      }

      const scopes = result.scopes || [];
      const canEat = scopes.includes('carrot:action:eat');

      if (!canEat) {
        setStatus('🧱 Bunny\'s through — but hasn\'t earned dinner rights.');
        render({
          chainDown: true,
          wallDown: false,
          tech: `Identity valid — did=${result.did}, trustLevel=${result.trustLevel}, scopes=[${scopes.join(', ')}]\nRejected — signature valid; declared scope does not include required "carrot:action:eat" per _aria-policy.thecarrot.rest`,
        });
      } else {
        setStatus('🧱💥 Scope granted. Drag Bunny all the way home.');
        render({
          chainDown: true,
          wallDown: true,
          tech: `Identity valid — did=${result.did}, trustLevel=${result.trustLevel}, scopes=[${scopes.join(', ')}]\nAdmitted — signature valid; scope satisfies req.eat=carrot:action:eat`,
        });
      }
    }

    main();
  </script>
</body>
</html>
