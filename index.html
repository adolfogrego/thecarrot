<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thecarrot.rest</title>
<style>
  :root {
    --bg: #F2F6EC;
    --ink: #1C2417;
    --accent: #4C7A3D;
    --line: #D8E4CB;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 0 2.5rem;
    overscroll-behavior: none;
  }
  .brand { font-size: 0.95rem; color: #6E8A5E; margin-bottom: 1.2rem; }
  .loading { text-align: center; padding: 2rem; color: #6E8A5E; font-family: var(--mono); font-size: 0.85rem; }

  /*
    Arquitectura: una sola cuadrícula (CSS Grid) de 3 columnas para TODO el
    track. La columna central tiene ancho fijo y es la MISMA en cada
    renglón — eso es lo único que garantiza que Bunny, el hueco de la
    cadena, el hueco del muro y la zanahoria queden perfectamente alineados,
    sin medir nada por JavaScript. Las columnas laterales son simple
    decorado — relleno largo y fijo, nunca medido, nunca calculado.
  */
  #track {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 4.5rem 1fr;
    row-gap: 1.6rem;
    align-items: center;
    width: 100%;
    overflow: hidden;
  }

  .side {
    overflow: hidden;
    white-space: nowrap;
    font-size: 1.4rem;
    letter-spacing: -0.15em;
  }
  .side.left { text-align: right; }
  .side.right { text-align: left; }

  .center-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .barrier-fill {
    font-size: 1.4rem;
    letter-spacing: -0.15em;
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    text-align: center;
    transition: opacity .6s ease;
  }
  .barrier-row.open .barrier-fill { opacity: 0.08; }

  #bunny {
    font-size: 3.2rem;
    cursor: grab;
    user-select: none;
    touch-action: none;
    z-index: 5;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
  }
  #bunny.dragging { cursor: grabbing; }

  #zone-end { font-size: 3rem; }

  .status-text { font-size: 0.95rem; text-align: center; max-width: 30ch; min-height: 2.6em; margin-top: 1.4rem; font-weight: 600; }
  .hint { font-family: var(--mono); font-size: 0.72rem; color: #8BA27C; margin-top: -0.6rem; }

  .links { display: flex; gap: 1rem; margin-top: 1.4rem; font-family: var(--mono); font-size: 0.78rem; }
  .links a, .links button { color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; font-size: inherit; padding: 0; }
  #policy-box, #tech-box { display: none; width: 100%; max-width: 420px; margin-top: 1rem; }
  #policy-box pre, #tech-box pre { font-size: 0.72rem; background: #E9F0E1; border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div class="brand">thecarrot.rest</div>

  <div id="loading" class="loading">Checking Bunny's credential…</div>

  <div id="track" style="display:none">
    <!-- renglón 1: Bunny -->
    <div class="side left"></div>
    <div class="center-cell" id="zone-start"><span id="bunny">🐇</span></div>
    <div class="side right"></div>

    <!-- renglón 2: cadena -->
    <div class="side left" data-fill="🔗"></div>
    <div class="center-cell barrier-row" id="barrier-chain">
      <span class="barrier-fill" data-fill="🔗"></span>
    </div>
    <div class="side right" data-fill="🔗"></div>

    <!-- renglón 3: muro -->
    <div class="side left" data-fill="🧱"></div>
    <div class="center-cell barrier-row" id="barrier-wall">
      <span class="barrier-fill" data-fill="🧱"></span>
    </div>
    <div class="side right" data-fill="🧱"></div>

    <!-- renglón 4: zanahoria -->
    <div class="side left"></div>
    <div class="center-cell" id="zone-end">🥕</div>
    <div class="side right"></div>
  </div>

  <p class="status-text" id="status-text" style="display:none"></p>
  <p class="hint" id="hint" style="display:none">drag 🐇 forward</p>

  <div class="links">
    <button id="policy-toggle">view policy</button>
    <button id="tech-toggle">technical panel</button>
  </div>

  <div id="policy-box">
    <pre>_aria-policy.thecarrot.rest TXT
"v=ATP1; min=L0; req.reach=carrot:action:reach; req.eat=carrot:action:eat; fresh=3600; anchor=wellknown"</pre>
  </div>

  <div id="tech-box">
    <pre id="tech-content">—</pre>
  </div>

  <script type="module">
    import { verifyAgent, setRegistryKeys } from 'https://esm.sh/@aria-registry/verify@1.1.0';

    const BUNNY_ORIGIN = 'https://thebunny.bar';
    const REPEAT = 120; // relleno fijo y generoso — no se mide nada, no hay nada que desalinear

    document.querySelectorAll('[data-fill]').forEach((el) => {
      el.textContent = el.dataset.fill.repeat(REPEAT);
    });

    document.getElementById('policy-toggle').addEventListener('click', () => {
      const box = document.getElementById('policy-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });
    document.getElementById('tech-toggle').addEventListener('click', () => {
      const box = document.getElementById('tech-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });

    function hexToBytes(hex) {
      const clean = hex.trim();
      const bytes = new Uint8Array(clean.length / 2);
      for (let i = 0; i < clean.length; i += 2) bytes[i / 2] = parseInt(clean.substring(i, i + 2), 16);
      return bytes;
    }

    function base64urlToJson(param) {
      let base64 = param.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4 !== 0) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function setStatus(text) {
      document.getElementById('status-text').textContent = text;
    }

    // --- Arrastre: SOLO vertical (translateY), la posición horizontal de
    // Bunny ya la resuelve el grid, nunca JS. ---
    const track = document.getElementById('track');
    const bunny = document.getElementById('bunny');
    const chainRow = document.getElementById('barrier-chain');
    const wallRow = document.getElementById('barrier-wall');
    const zoneStart = document.getElementById('zone-start');
    const zoneEnd = document.getElementById('zone-end');

    let chainOpen = false;
    let wallOpen = false;

    // Distancia vertical, relativa a la posición natural de Bunny (renglón 1).
    function offsetTo(targetEl) {
      return targetEl.getBoundingClientRect().top - zoneStart.getBoundingClientRect().top;
    }

    function clampLimit() {
      if (!chainOpen) return offsetTo(chainRow);
      if (!wallOpen) return offsetTo(wallRow);
      return offsetTo(zoneEnd);
    }

    function placeBunnyAt(offsetY) {
      bunny.style.transform = `translateY(${offsetY}px)`;
    }

    let currentOffset = 0;
    let dragging = false;
    let dragStartClientY = 0;
    let dragStartOffset = 0;

    bunny.addEventListener('pointerdown', (e) => {
      dragging = true;
      bunny.classList.add('dragging');
      bunny.setPointerCapture(e.pointerId);
      dragStartClientY = e.clientY;
      dragStartOffset = currentOffset;
    });
    bunny.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const delta = e.clientY - dragStartClientY;
      const max = clampLimit();
      currentOffset = Math.max(0, Math.min(max, dragStartOffset + delta));
      placeBunnyAt(currentOffset);
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      bunny.classList.remove('dragging');
      const candidates = [0];
      if (chainOpen) candidates.push((offsetTo(chainRow) + offsetTo(wallRow)) / 2);
      if (wallOpen) candidates.push(offsetTo(zoneEnd));
      let best = candidates[0];
      let bestDist = Math.abs(currentOffset - best);
      for (const c of candidates) {
        const d = Math.abs(currentOffset - c);
        if (d < bestDist) { best = c; bestDist = d; }
      }
      currentOffset = best;
      bunny.style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1)';
      placeBunnyAt(currentOffset);
      setTimeout(() => { bunny.style.transition = ''; }, 350);
    }
    bunny.addEventListener('pointerup', endDrag);
    bunny.addEventListener('pointercancel', endDrag);

    function render({ chainDown, wallDown, tech }) {
      chainOpen = chainDown;
      wallOpen = wallDown;
      if (chainDown) chainRow.classList.add('open');
      if (wallDown) wallRow.classList.add('open');
      document.getElementById('tech-content').textContent = tech;
      document.getElementById('hint').style.display = 'block';
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const credParam = params.get('credential');

      document.getElementById('loading').style.display = 'none';
      track.style.display = 'grid';
      document.getElementById('status-text').style.display = 'block';

      if (!credParam) {
        setStatus('🔗 Who goes there? Bunny can\'t prove it yet.');
        render({ chainDown: false, wallDown: false, tech: 'No credential presented.' });
        return;
      }

      let credential;
      try {
        credential = base64urlToJson(credParam);
      } catch (e) {
        setStatus('🔗 That link is malformed — Bunny stays put.');
        render({ chainDown: false, wallDown: false, tech: 'Could not decode credential param: ' + e.message });
        return;
      }

      let identity;
      try {
        const res = await fetch(BUNNY_ORIGIN + '/.well-known/aria-identity.json', { cache: 'no-store' });
        identity = await res.json();
      } catch (e) {
        setStatus('🔗 Could not reach thebunny.bar to check the key.');
        render({ chainDown: false, wallDown: false, tech: 'Discovery fetch failed: ' + e.message });
        return;
      }

      setRegistryKeys(hexToBytes(identity.pq), hexToBytes(identity.ed));
      const result = verifyAgent(credential);

      if (!result.valid) {
        setStatus('🔗 Signature check failed — the chain stays shut.');
        render({ chainDown: false, wallDown: false, tech: 'Rejected — ' + result.reason });
        return;
      }

      const scopes = result.scopes || [];
      const canEat = scopes.includes('carrot:action:eat');

      if (!canEat) {
        setStatus('🧱 Bunny\'s through — but hasn\'t earned dinner rights.');
        render({
          chainDown: true,
          wallDown: false,
          tech: `Identity valid — did=${result.did}, trustLevel=${result.trustLevel}, scopes=[${scopes.join(', ')}]\nRejected — signature valid; declared scope does not include required "carrot:action:eat" per _aria-policy.thecarrot.rest`,
        });
      } else {
        setStatus('🧱💥 Scope granted. Drag Bunny all the way home.');
        render({
          chainDown: true,
          wallDown: true,
          tech: `Identity valid — did=${result.did}, trustLevel=${result.trustLevel}, scopes=[${scopes.join(', ')}]\nAdmitted — signature valid; scope satisfies req.eat=carrot:action:eat`,
        });
      }
    }

    main();
  </script>
</body>
</html>
